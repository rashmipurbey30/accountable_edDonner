<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C: Pipeline · Accountable</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="c.css">
<script src="mock.js"></script>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main class="main">
    <header class="head">
      <h1>Pipeline</h1>
      <div class="head-figs" id="figs"></div>
    </header>
    <section class="board" id="board"></section>
  </main>
</div>
<script>
ready(() => {
  document.getElementById("side").innerHTML = sideNav("pipeline", "c-");
  document.getElementById("figs").innerHTML = [
    ["Open pipeline", usd(FIG.openValue)], ["Expected revenue", usd(FIG.openExpected)], ["Open deals", FIG.openCount],
  ].map(([l, v]) => `<div><div class="fig-label">${l}</div><div class="fig-value num">${v}</div></div>`).join("") +
    `<button class="btn btn-primary">${icon("plus", 16)}Add deal</button>`;

  // Probability as a small ring in the stage color
  const ring = (p, color) => {
    const r = 13, c = 2 * Math.PI * r;
    return `<svg class="ring" width="34" height="34" viewBox="0 0 34 34" role="img" aria-label="${p}% probability">
      <circle cx="17" cy="17" r="${r}" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="17" cy="17" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${(p / 100) * c} ${c}" transform="rotate(-90 17 17)"/>
      <text x="17" y="20.5" text-anchor="middle" style="font:600 9px var(--mono);fill:#073B4C">${p}</text></svg>`;
  };
  const card = (d) => {
    const st = stage(d.stage);
    return `<article class="deal">
      <div class="deal-name">${d.name}</div>${ring(d.p, st.color)}
      <div class="deal-org">${d.org}</div>
      <div class="deal-value num">${usd(d.value)}</div>
      <div class="deal-date">${d.late ? '<span class="badge badge-late">Late</span>' : icon("calendar", 13)}
        <span class="num ${d.late ? "late-text" : ""}">${dateShort(d.close)}</span>
        <span class="avatar" title="${d.contact}">${d.who}</span></div>
    </article>`;
  };
  const compact = (d) => `<article class="deal compact">
      <div class="deal-name">${d.name}</div><div class="deal-org">${d.org}</div>
      <div class="deal-value num">${usd(d.value)}</div>
      ${d.lostReason ? `<div class="lost-r">${d.lostReason}</div>` : ""}
      <div class="deal-date"><span class="num">${d.stage === "won" ? "Won" : "Lost"} ${dateShort(d.close)}</span></div></article>`;

  document.getElementById("board").innerHTML = STAGES.map((st) => {
    const t = stageTotals(st.key);
    const closed = st.key === "won" || st.key === "lost";
    const share = closed ? 0 : (t.value / FIG.openValue) * 100;
    return `<div class="col">
      <div class="col-head">
        <div class="col-name"><span class="dot" style="background:${st.color}"></span>${st.name}<span class="n num">${t.count}</span></div>
        ${closed ? '<div class="col-note">Closed in the last 30 days</div>' :
          `<div class="share" title="${Math.round(share)}% of open value"><div style="width:${share}%;background:${st.color}"></div></div>`}
        <div class="col-figs" style="${closed ? "margin-top:8px" : ""}"><span class="num">${usd(t.value)}</span>${closed ? "" : `<span class="num muted">exp. ${usdShort(t.expected)}</span>`}</div>
      </div>
      <div class="cards">${byStage(st.key).map(closed ? compact : card).join("")}</div>
      <a class="add">${icon("plus", 14)}Add deal</a>
    </div>`;
  }).join("");
});
</script>
</body>
</html>
